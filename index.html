<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#070b18">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JG">

<meta name="description"
      content="JG — global learning, work, AI and digital services platform.">

<title>JG — Learn. Work. Create.</title>

<style>

/* ================================
   JG GLOBAL DESIGN SYSTEM
================================ */

:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --panel2: #eef1f8;
  --text: #11162a;
  --muted: #69738a;
  --line: #dfe4ef;

  --purple: #7c3aed;
  --cyan: #06b6d4;

  --success: #22c55e;
  --danger: #ef4444;

  --shadow: 0 18px 55px rgba(16,20,38,.08);
}

body.dark {
  --bg: #060916;
  --panel: #0d1427;
  --panel2: #151d32;
  --text: #f5f7ff;
  --muted: #a5aec2;
  --line: #222d46;

  --shadow: 0 18px 55px rgba(0,0,0,.35);
}


/* ================================
   RESET
================================ */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--bg);
  color: var(--text);

  transition:
    background .25s ease,
    color .25s ease;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  text-decoration: none;
  color: inherit;
}


/* ================================
   APP
================================ */

.app {
  min-height: 100vh;
}


/* ================================
   TOP NAVIGATION
================================ */

.top {
  position: sticky;
  top: 0;
  z-index: 20;

  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    0
    max(15px, calc((100vw - 1180px) / 2));

  background:
    color-mix(
      in srgb,
      var(--bg) 88%,
      transparent
    );

  backdrop-filter: blur(18px);

  border-bottom:
    1px solid var(--line);
}

.brand {
  border: 0;
  background: none;

  color: var(--text);

  font-weight: 900;
  font-size: 21px;

  display: flex;
  gap: 10px;
  align-items: center;
}

.logo {
  width: 40px;
  height: 40px;

  border-radius: 13px;

  display: grid;
  place-items: center;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  box-shadow:
    0 8px 25px rgba(124,58,237,.35);
}

.topActions {
  display: flex;
  gap: 8px;
}

.icon {
  position: relative;

  width: 42px;
  height: 42px;

  border:
    1px solid var(--line);

  background: var(--panel);
  color: var(--text);

  border-radius: 13px;

  display: grid;
  place-items: center;
}

.badge {
  position: absolute;

  right: -3px;
  top: -4px;

  background: var(--danger);
  color: white;

  border-radius: 9px;

  font-size: 9px;

  padding:
    2px 5px;
}


/* ================================
   MAIN CONTAINER
================================ */

.wrap {
  max-width: 1180px;

  margin: auto;

  padding:
    28px
    18px
    110px;
}


/* ================================
   HERO
================================ */

.hero {
  min-height: 410px;

  padding: 45px;

  border:
    1px solid var(--line);

  border-radius: 30px;

  background:
    radial-gradient(
      circle at 80% 15%,
      rgba(6,182,212,.15),
      transparent 27%
    ),
    radial-gradient(
      circle at 60% 100%,
      rgba(124,58,237,.18),
      transparent 32%
    ),
    var(--panel);

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 30px;

  box-shadow: var(--shadow);

  overflow: hidden;
}

.eyebrow {
  font-size: 11px;

  font-weight: 900;

  letter-spacing: .15em;

  color: var(--muted);
}

h1 {
  font-size:
    clamp(
      38px,
      6vw,
      68px
    );

  line-height: 1.02;

  margin:
    12px 0;
}

h2 {
  margin:
    0 0 8px;
}

h3 {
  margin:
    0 0 8px;
}

.gradient {
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--cyan)
    );

  color: transparent;

  background-clip: text;
}

.lead {
  font-size: 17px;

  line-height: 1.6;

  color: var(--muted);

  max-width: 670px;
}

.actions {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: 24px;
}


/* ================================
   BUTTONS
================================ */

.btn {
  border: 0;

  border-radius: 13px;

  padding:
    12px
    16px;

  font-weight: 850;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;
}

.primary {
  color: white;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  box-shadow:
    0 10px 28px
    rgba(124,58,237,.30);
}

.secondary {
  color: var(--text);

  background: var(--panel);

  border:
    1px solid var(--line);
}


/* ================================
   AI ORB
================================ */

.orb {
  width: 210px;
  height: 210px;

  flex: none;

  border-radius: 50%;

  display: grid;
  place-items: center;

  text-align: center;

  color: white;

  background:
    radial-gradient(
      circle at 30% 20%,
      #67e8f9,
      #7c3aed 55%,
      #111827
    );

  box-shadow:
    0 0 90px
    rgba(124,58,237,.33);
}

.orb b {
  font-size: 27px;
}

.orb small {
  display: block;
}


/* ================================
   STATS
================================ */

.stats {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

  margin: 16px 0;
}

.card {
  background: var(--panel);

  border:
    1px solid var(--line);

  border-radius: 18px;

  box-shadow: var(--shadow);
}

.stat {
  padding: 20px;
}

.stat b {
  font-size: 25px;
}

.stat span {
  display: block;

  color: var(--muted);

  font-size: 12px;

  margin-top: 4px;
}


/* ================================
   SECTION HEADERS
================================ */

.sectionHead {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin:
    32px 0
    14px;
}

.sectionHead button {
  border: 0;

  background: none;

  color: var(--purple);

  font-weight: 800;
}


/* ================================
   COURSE GRID
================================ */

.grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;
}

.course {
  overflow: hidden;
}

.cover {
  height: 135px;

  padding: 15px;

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  color: white;

  background:
    linear-gradient(
      135deg,
      #312e81,
      #7c3aed,
      #0891b2
    );
}

.tag {
  font-size: 10px;

  font-weight: 900;

  padding:
    6px 8px;

  border-radius: 8px;

  background:
    rgba(255,255,255,.17);
}

.courseBody {
  padding: 16px;
}

.muted {
  color: var(--muted);

  font-size: 12px;
}

.progress {
  height: 6px;

  background:
    var(--panel2);

  border-radius: 9px;

  overflow: hidden;

  margin-top: 15px;
}

.progress i {
  display: block;

  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--cyan)
    );
}

.courseFoot {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 9px;

  font-size: 12px;
}

.courseFoot button {
  border: 0;

  background: none;

  color: var(--purple);

  font-weight: 850;
}


/* ================================
   FEATURE CARDS
================================ */

.features {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;
}

.feature {
  padding: 19px;

  display: flex;

  align-items: center;

  gap: 13px;

  text-align: left;

  color: var(--text);
}

.feature .fi {
  width: 45px;
  height: 45px;

  border-radius: 13px;

  display: grid;
  place-items: center;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );
}

.feature div:nth-child(2) {
  flex: 1;
}

.feature p {
  margin: 3px 0 0;

  color: var(--muted);

  font-size: 13px;
}


/* ================================
   RESPONSIVE
================================ */

@media(max-width:800px) {

  .hero {
    padding: 30px;
  }

  .orb {
    width: 155px;
    height: 155px;
  }

  .grid {
    grid-template-columns:
      1fr 1fr;
  }

  .stats {
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:560px) {

  .top {
    height: 63px;
  }

  .wrap {
    padding:
      20px
      13px
      100px;
  }

  .hero {
    display: block;

    border-radius: 23px;
  }

  .hero h1 {
    font-size: 42px;
  }

  .orb {
    margin:
      25px
      auto
      0;
  }

  .grid,
  .features {
    grid-template-columns: 1fr;
  }

  .pageTitle {
    display: block;
  }

  .pageTitle .btn {
    width: 100%;
    margin-top: 12px;
  }

}

</style>
</head>
